<!--
==========================================================================
 EJERCICIO 03 · Formulario de perfil (v-model)
==========================================================================

 QUÉ VAS A APRENDER
   - Conectar inputs con datos usando v-model

 CÓMO FUNCIONA
   v-model conecta un input con un ref EN LAS DOS DIRECCIONES:
     - si escribís en el input, cambia el ref
     - si cambia el ref (desde el JS), cambia lo que muestra el input

   Funciona con todos los controles de formulario:
     <input v-model="texto">                        string
     <input v-model.trim="texto">                   .trim saca los espacios de los bordes
     <input type="number" v-model.number="edad">    .number lo convierte a número
     <input type="checkbox" v-model="acepto">       true / false
     <select v-model="pais"> ... </select>          el value de la opción elegida
     <textarea v-model="bio"></textarea>            string (ojo: NO pongas {{ }} adentro del textarea)

   Mirá el ejemplo: el campo "Nombre" ya está conectado y aparece en la vista previa.

 TU TAREA
   Completá el formulario para que la vista previa de la derecha se actualice en vivo.
   TODO 1: Creá un ref `edad` y conectalo al input de edad con v-model.number.
           En la vista previa mostrá "___ años".
   TODO 2: Creá un ref `ciudad` (que arranque en '') y conectalo al select.
           Mostrala en la vista previa.
   TODO 3: Creá un ref `bio` y conectalo al textarea. Mostrala en la vista previa
           y, debajo del textarea, cuántos caracteres llevás: "37 / 140".
   TODO 4: Creá un ref `publico` (true o false) y conectalo al checkbox.
           En la vista previa mostrá "Perfil público" o "Perfil privado".
   TODO 5: El botón "Limpiar" tiene que volver todo a los valores iniciales
           (creá una función limpiar()). Fijate cómo los inputs se vacían solos:
           eso es el "en las dos direcciones" de v-model.

 CÓMO SABÉS QUE ESTÁ BIEN
   Todo lo que escribís a la izquierda aparece al instante a la derecha.

 DESAFÍO EXTRA
   Agregá un grupo de checkboxes "Intereses" (Música, Deportes, Programación...).
   Si varios checkboxes usan v-model con el MISMO ref que es un array, Vue mete

       <input type="checkbox" value="Deportes" v-model="intereses">
   Mostralos en la vista previa separados por comas (pista: .join(', ')).
==========================================================================
-->
