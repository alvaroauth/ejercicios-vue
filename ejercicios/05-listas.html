==========================================================================
 EJERCICIO 05 · Lista del súper (v-for)
==========================================================================

 QUÉ VAS A APRENDER
   - Repetir un elemento por cada ítem de un array con v-for
   - Agregar y borrar ítems de una lista
   - Eventos de teclado (@keyup.enter)

 CÓMO FUNCIONA
   v-for repite el elemento donde lo ponés, una vez por ítem:
     <li v-for="fruta in frutas" :key="fruta">{{ fruta }}</li>

   Si necesitás el índice (la posición):
     <li v-for="(fruta, i) in frutas" :key="fruta">{{ i + 1 }}. {{ fruta }}</li>

   Con un array de objetos:
     <li v-for="p in personas" :key="p.id">{{ p.nombre }} tiene {{ p.edad }}</li>

   :key le da a Vue un identificador ÚNICO de cada ítem, para que sepa cuál es
   cuál cuando la lista cambia. Usá siempre un id si lo tenés.

   Para cambiar la lista desde el JS (acordate del .value):
     frutas.value.push('kiwi')                               agrega al final
     frutas.value = frutas.value.filter(f => f !== 'kiwi')   se queda con todas menos 'kiwi'

   @keyup.enter="agregar" llama a agregar cuando soltás la tecla Enter.

   ⚠️ No pongas v-if y v-for en el MISMO elemento. Si necesitás los dos,
      poné el v-if en un elemento de afuera (por ejemplo en el <ul>).
