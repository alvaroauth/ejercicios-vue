==========================================================================
 EJERCICIO 02 · Contador (eventos con @click)
==========================================================================

 QUÉ VAS A APRENDER
   - Reaccionar a clicks con @click
   - Escribir funciones en setup() que cambian datos
   - LA REGLA DEL .value (la causa número 1 de errores al empezar)

 CÓMO FUNCIONA
   Un ref es una cajita. En el JavaScript accedés al contenido con .value:
       const contador = ref(0)
       contador.value++            ✅ en el script: SIEMPRE con .value
       contador++                  ❌ esto no anda

   En el template, Vue saca el .value por vos:
       {{ contador }}              ✅ en el HTML: SIN .value

   @click="..." ejecuta algo cuando se hace click. Puede ser:
       @click="saludar"            llama a la función saludar
       @click="sumar(5)"           llama a la función con un argumento
       @click="contador = 0"       una expresión cortita, directo en el HTML
   (@click es la forma corta de v-on:click. Hay más: @dblclick, @mouseover, @keyup...)

   Las funciones también hay que devolverlas en el return para usarlas en el template.

 TU TAREA
   TODO 1: Completá incrementar() y conectala al botón "+1".

   TODO 3: El botón "Reiniciar" tiene que poner el contador en 0.
           Hacelo SIN función: con una expresión directa en el @click.
   TODO 4: Creá una función sumar(cantidad) y usala en los botones "+5" y "+10".
   TODO 5: Debajo del número mostrá "Es par" o "Es impar".
           (pista: numero % 2 === 0 y el operador ternario   condicion ? 'a' : 'b')

 CÓMO SABÉS QUE ESTÁ BIEN
   Todos los botones cambian el número grande, y el par/impar se actualiza solo.

 DESAFÍO EXTRA
   - Que el contador nunca baje de 0.
   - Un segundo ref `clicks` que cuente cuántas veces se apretó cualquier botón.
==========================================================================
-->
