<!--
==========================================================================
 EJERCICIO 09 · Datos de internet (onMounted + fetch)
==========================================================================

 QUÉ VAS A APRENDER
   - El ciclo de vida: hacer cosas cuando la app aparece en la página
   - Pedir datos a una API con fetch
   - Mostrar los estados "cargando", "error" y "listo"

 CÓMO FUNCIONA
   Cada componente tiene un ciclo de vida: se crea, aparece en la página
   (se "monta"), se actualiza y, a veces, se va (se "desmonta").
   Te podés enganchar a esos momentos:
     onMounted(() => { ... })      cuando ya está en la página: ideal para pedir datos
     onUnmounted(() => { ... })    cuando se va: ideal para limpiar timers
   Mirá el reloj de ejemplo, usa los dos.

   Pedir datos con fetch + async/await:
     async function cargar() {
       const respuesta = await fetch('https://...')   // esperá la respuesta
       const datos = await respuesta.json()           // convertila a objeto JS
     }

   Siempre que pedís datos hay TRES situaciones que mostrar:
     cargando   "Cargando..."
     error      "Algo salió mal"
     listo      los datos

   Vamos a usar https://jsonplaceholder.typicode.com, una API de prueba gratis.
   Abrí https://jsonplaceholder.typicode.com/users en el navegador para ver qué devuelve.

           API + '/users' con fetch, guardá el resultado en `usuarios`
           y al final poné `cargando` en false.
   TODO 3: En el template: mientras cargando sea true mostrá "Cargando...";
           cuando termine, la lista de usuarios (nombre y email) con v-for.
   TODO 4: Errores. Envolvé el fetch en try / catch / finally:
             try      el fetch
             catch    guardá un mensaje en `error`
             finally  cargando en false (finally se ejecuta SIEMPRE)
           Mostrá el error en el template. Probalo cambiando la URL por
           una que no existe, por ejemplo API + '/usuariosss'.
           ⚠️ fetch NO tira error con un 404: revisá respuesta.ok y, si es
           false, tirá vos el error: throw new Error('Error ' + respuesta.status)
   TODO 5: Al hacer click en un usuario, llamá a verTareas(u) y mostrá sus tareas,

   - Resaltá el usuario elegido (clase "elegido", ya existe en estilos.css).
==========================================================================
-->
