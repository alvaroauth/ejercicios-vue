==========================================================================
 EJERCICIO 11 · Votación de helados (eventos con emit)
==========================================================================

 QUÉ VAS A APRENDER
   - Cómo un componente hijo le avisa algo al padre: emit

 CÓMO FUNCIONA
   Los datos BAJAN con props   (padre → hijo)
   Los avisos SUBEN con eventos (hijo → padre)

   En el hijo declarás qué eventos puede emitir, y los emitís:
     app.component('boton-like', {
       emits: ['like'],
       setup(props, { emit }) {
         function click() {
           emit('like')              // o con un dato: emit('like', 5)
         }
         return { click }
       },
       template: `<button @click="click">👍</button>`
     })
   (en el template del hijo también podés hacer directo: @click="$emit('like')")

   En el padre escuchás el evento igual que un click:
     <boton-like @like="sumarLike"></boton-like>
     <boton-like @like="likes++"></boton-like>
   Si el evento trae un dato, la función del padre lo recibe como argumento:
     emit('like', 5)   llega a   function sumarLike(cantidad) { ... }

   ⚠️ Con templates escritos en el HTML, nombres de eventos en kebab-case:
      emit('borrar-item') y @borrar-item

   Fijate en la idea clave: los hijos NUNCA modifican `sabores` directamente.
   Solo avisan "me votaron", y el padre, que es el dueño de los datos, decide.

==========================================================================
